[project]
name = "incident-triage"
version = "0.1.0"
description = "Read-only Claude agent that triages new PagerDuty/ServiceNow incidents and posts a root-cause hypothesis to Slack."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
triage-serve = "triage.intake:main"
triage-eval = "triage.eval.run_eval:main"
triage-once = "triage.cli:main"
triage-export = "triage.eval.export_incidents:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
